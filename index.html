<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Xpomatoru — вход</title><style>
:root{
  color-scheme:dark;
  --steel-light:#eef3f4;
  --steel-muted:#b7c5cc;
  --steel-edge:#51626d;
  --copper:#e5a875;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;color:var(--steel-light);font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:#101820;
}
body:has(#login:not([hidden])){
  min-height:100vh;min-height:100svh;display:grid;align-content:center;
  padding:24px;
  background-color:#101820;
  background-image:linear-gradient(100deg,rgba(8,15,26,.26),rgba(8,15,26,.08) 64%,rgba(8,15,26,.16)),url("./laser-cut.webp");
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
#login{
  width:100%;max-width:420px;margin:0 auto;padding:32px;
  background:linear-gradient(140deg,#24353f 0%,#192731 48%,#15212a 100%);
  border:1px solid var(--steel-edge);border-radius:14px;
  box-shadow:inset 0 1px 0 #c1d6df20,0 18px 60px #030a106e;
}
.brand{display:flex;align-items:center;gap:13px}
.brand svg{width:64px;height:64px;flex:none}
#login h1{margin:0;font:clamp(29px,6vw,38px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:.5px}
#login .intro{margin:15px 0 0;font-size:13px;line-height:1.55;text-wrap:pretty}
#login p{margin:0;color:var(--steel-muted)}
#unlock{margin-top:24px}
#unlock label{display:block;margin:0 0 7px;font-weight:600;color:#d6e1e6}
#password,#submit{display:block;width:100%;min-height:45px;padding:10px 13px;font:inherit;border-radius:6px}
#password{background:#101b23;border:1px solid #667984;color:var(--steel-light)}
#password:focus-visible,#submit:focus-visible{outline:2px solid #f3c395;outline-offset:3px}
#submit{margin-top:14px;background:var(--copper);color:#231a14;border:1px solid #f0bb90;font-weight:650;opacity:1}
#submit:enabled:hover{background:#eeb686;cursor:pointer}
#login #error{color:#ffb5a7}
#login #error:not(:empty){margin-top:14px}
@media(max-width:640px){body:has(#login:not([hidden])){padding:18px;background-position:72% center}#login{padding:25px}}
#bar{height:36px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#1b2133}
#bar button{cursor:pointer;padding:3px 10px;font:inherit;color:inherit;background:#6450b8;border:1px solid #535d7c;border-radius:6px}
#update{color:#ffe2a3}
#workspace{display:block;width:100%;height:calc(100vh - 36px);border:0}
#submit:disabled{opacity:.7;cursor:wait}
</style><script type="module" src="./gate.mjs"></script></head><body>
<main id="login"><header>
<div class="brand">
<svg class="seal-mark" viewBox="0 0 72 72" aria-hidden="true"><defs><path id="seal-top" d="M12 36 A24 24 0 0 1 60 36"/>
      <path id="seal-bottom" d="M11 37 A25 25 0 0 0 61 37"/>
      <symbol id="seal" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="33" fill="none" stroke="currentColor" stroke-width=".8"/>
        <circle cx="36" cy="36" r="21" fill="none" stroke="currentColor" stroke-width=".5" opacity=".55"/>
        <g fill="currentColor" font-family="Arial, sans-serif" font-size="6.1" letter-spacing="2.1">
          <text><textPath href="#seal-top" startOffset="50%" text-anchor="middle">XPOMATORU</textPath></text>
          <text font-size="4.7" letter-spacing="1.6"><textPath href="#seal-bottom" startOffset="50%" text-anchor="middle">FORM · PRECISION</textPath></text>
        </g>
        <path d="M36 20 43 36 36 51 29 36Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M36 25V46M24 36H48" stroke="currentColor" stroke-width=".8"/>
        <circle cx="7.5" cy="36" r="1" fill="currentColor"/><circle cx="64.5" cy="36" r="1" fill="currentColor"/>
      </symbol></defs><use href="#seal"/></svg>
<h1>Xpomatoru</h1></div>
<p class="intro">Введите пароль для входа. Файлы раскроя остаются на вашем компьютере.</p>
</header>
<form id="unlock"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="off"><button id="submit">Открыть</button></form><p id="error" role="alert"></p></main>
<header id="bar" hidden><span>Xpomatoru</span><span id="update" hidden>Вышла новая версия — сохраните проект и обновите страницу.</span><button id="refresh" hidden>Обновить страницу</button><button id="lock">Закрыть доступ</button></header>
<iframe id="workspace" title="Программа раскроя" hidden></iframe>
</body></html>
